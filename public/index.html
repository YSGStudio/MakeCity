<style>
  :root{--ink:#2b3a42;--card:rgba(255,255,255,.92);--accent:#ff8a3d;--sea:#2f8fd8;--mt:#4c9a4a;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#bfe6ff}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font-family:inherit;cursor:pointer}
  .card{background:var(--card);border-radius:16px;box-shadow:0 6px 20px rgba(30,60,90,.18);backdrop-filter:blur(6px)}
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;z-index:5}
  #top .title{font-family:'Jua',sans-serif;font-size:22px;white-space:nowrap}
  .tabs{display:flex;gap:6px}
  .tabs button{font-family:'Jua';font-size:16px;border:none;border-radius:12px;padding:7px 14px;background:#e9eef2;color:#567}
  .tabs button.on.coast{background:var(--sea);color:#fff}
  .tabs button.on.mountain{background:var(--mt);color:#fff}
  .tabs button.on.plain{background:#d99a14;color:#fff}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .stat{background:#f3f6f8;border-radius:10px;padding:4px 10px;font-size:14px;white-space:nowrap}
  .stat b{font-size:16px;margin-left:3px}
  #tools{position:fixed;left:10px;top:var(--top-h,84px);bottom:var(--bottom-h,76px);width:200px;overflow-y:auto;padding:8px;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:5px;z-index:4}
  .tool{border:2px solid transparent;border-radius:12px;background:#f5f8fa;padding:5px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;line-height:1.2}
  .tool.sep{grid-column:1/-1;background:none;font-family:'Jua';font-size:13px;color:#789;padding:4px 0 0;cursor:default}
  .tool .ic{font-size:21px}
  .tool small{display:block;color:#789;font-size:11px}
  .tool.on{border-color:var(--accent);background:#fff3e8}
  .tool.lock{opacity:.45}
  #panel{position:fixed;right:10px;top:var(--top-h,84px);bottom:var(--bottom-h,76px);width:300px;overflow-y:auto;padding:12px 14px;z-index:4}
  #panel h3{font-family:'Jua';font-weight:400;font-size:17px;margin:10px 0 4px}
  #panel h3:first-child{margin-top:0}
  #panel p{margin:0;font-size:13.5px;line-height:1.55}
  #era{background:#fff8e6;border-left:4px solid var(--accent);padding:6px 8px;border-radius:6px}
  #missions{list-style:none;padding:0;margin:0;font-size:13.5px}
  #missions li{padding:3px 0}
  #missions li.ok{color:#2e7d32;text-decoration:line-through}

  #log{font-size:12.5px;line-height:1.5;max-height:220px;overflow-y:auto}
  #log div{padding:3px 0;border-bottom:1px dashed #dde5ea}
  #log b{color:var(--accent);margin-right:4px}
  #bottom{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 20px);bottom:10px;display:flex;gap:8px;padding:8px;z-index:5;flex-wrap:wrap;justify-content:center}
  #bottom button{font-family:'Jua';font-size:16px;border:none;border-radius:12px;padding:9px 14px;background:#e9eef2;color:var(--ink)}
  #bottom button.primary{background:var(--accent);color:#fff}
  #bottom button.playing{background:#e53935;color:#fff}
  #btn-time{position:relative;overflow:hidden;min-width:190px;background:var(--accent);color:#fff}
  #btn-time.running{background:#c75f1c}
  #btn-time .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);background:rgba(255,255,255,.28);pointer-events:none}
  #btn-time .lbl{position:relative}
  #time-speed{font-family:'Jua';font-size:15px;border:none;border-radius:12px;padding:0 10px;background:#e9eef2;color:var(--ink);cursor:pointer}
  #tip{position:fixed;pointer-events:none;padding:6px 9px;font-size:12.5px;line-height:1.45;z-index:6;display:none;max-width:240px}
  #toast{position:fixed;top:var(--top-h,84px);left:50%;transform:translateX(-50%);padding:9px 16px;font-size:14px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1}
  #modal{position:fixed;inset:0;background:rgba(20,40,60,.45);display:flex;align-items:center;justify-content:center;z-index:10}

  #modal .card{width:min(720px,94vw);max-height:90vh;overflow-y:auto;padding:20px 24px}
  #modal h2{font-family:'Jua';font-weight:400;margin:0 0 10px}
  #modal table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  #modal th,#modal td{padding:6px 8px;border-bottom:1px solid #e3e9ee;text-align:center}
  #modal th:first-child,#modal td:first-child{text-align:left}
  #modal ol{font-size:14px;line-height:1.8;padding-left:20px}
  .stat.save{font-size:12px;color:#5a7;background:#eef7ef}
  .stat.save.warn{color:#b23c17;background:#fff0e6}
  .confirm-btns{display:flex;gap:8px;margin-top:12px}

  #pw-input{font-size:22px;letter-spacing:6px;width:180px;padding:8px 12px;border:2px solid #cfd8dc;border-radius:12px;text-align:center}

  #pw-msg{color:#c62828;font-size:14px;min-height:20px;margin-top:6px}
  .shake{animation:shake .3s}

  #modal-close[hidden]{display:none}

  #panel-toggle{display:none}
  @media (max-width:900px){

<div id="tools" class="card"></div>

<div id="bottom" class="card">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- 기본 설정 ---------------- */
const N = 24, START_YEAR = 1970, END_YEAR = 2030, STEP = 5;
const wx = x => x - N/2 + 0.5, wz = z => z - N/2 + 0.5;
const SC = N/20;   // 20×20 기준으로 만든 카메라·조명 값을 지도 크기에 맞추는 비율

/* 건물이 차지하는 칸 수 [가로, 세로]. 실제 크기에 비례: 작은 건물 1칸, 큰 시설일수록 넓게 */
const FOOT = {port:[1,2], apt:[1,2], station:[1,3],
              factory:[2,2], school:[2,2], hospital:[2,2], mart:[2,2], office:[2,2], park:[2,2],
              stadium:[3,3]};
const TOURISM_FOOT = {coast:[1,3], mountain:[2,2], plain:[3,3]};   // 해수욕장 · 스키장 · 놀이공원
const footSize = (M, tool) => tool==='tourism' ? TOURISM_FOOT[M.type] : (FOOT[tool] || [1,1]);
// 칸마다 모델을 하나씩 놓는 시설(비탈·해안선을 따라 놓임). 나머지 큰 건물은 모델 하나를 늘려서 그림
const TILED = b => b==='port' || b==='park' || b==='tourism-beach' || b==='tourism-ski';
// 큰 건물을 늘릴 때의 높이 배율
const SY = {apt:1, station:1, factory:1.3, school:1.3, hospital:1.6, mart:1.2, office:1.5, stadium:1.5, 'tourism-themepark':2.2};

function hash(x,z,s){ const v=Math.sin(x*127.1+z*311.7+s*74.7)*43758.5453; return v-Math.floor(v); }
function noise(x,z,s){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), w=zf*zf*(3-2*zf);
  const a=hash(xi,zi,s), b=hash(xi+1,zi,s), c=hash(xi,zi+1,s), d=hash(xi+1,zi+1,s);
  return a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w;
}
const q = h => Math.round(h*4)/4;
const valleyC = x => N/2 - 0.5 + Math.sin(x*0.35)*2;
const riverZ = x => 5 + Math.sin(x*0.4)*1.8;

/* ---------------- Three.js 장면 ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe6ff');
scene.fog = new THREE.Fog('#bfe6ff', 45*SC, 80*SC);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(17*SC, 21*SC, 21*SC);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = 1.32;
controls.minDistance = 8; controls.maxDistance = 45*SC;

scene.add(new THREE.HemisphereLight('#ffffff', '#7a9a6a', 1.1));
const sun = new THREE.DirectionalLight('#fff4dd', 1.8);
sun.position.set(12*SC, 22*SC, 8*SC);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-16*SC,right:16*SC,top:16*SC,bottom:-16*SC,near:1,far:60*SC});
sun.shadow.bias = -0.0008;
scene.add(sun);

const matCache = {};
function mat(c, opts){
  const k = c + (opts? JSON.stringify(opts):'');
  return matCache[k] ||= new THREE.MeshStandardMaterial(Object.assign({color:c, flatShading:true, roughness:0.9}, opts||{}));
}
function box(w,h,d,c,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y+h/2,z); m.castShadow = m.receiveShadow = true; return m;
}
function cone(r,h,seg,c,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat(c));
  m.position.set(x,y+h/2,z); m.castShadow = true; return m;
}
function cyl(r1,r2,h,seg,c,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), mat(c));
  m.position.set(x,y+h/2,z); m.castShadow = true; return m;
}

// 구름
const clouds = [];
for(let i=0;i<6;i++){
  const g = new THREE.Group();
  for(let j=0;j<3;j++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8+hash(i,j,9)*0.6,0), mat('#ffffff'));
    m.position.set(j*0.9-0.9, hash(i,j,3)*0.4, hash(j,i,4)*0.6); g.add(m);
  }
  g.position.set((-20+i*7)*SC, 12+hash(i,1,2)*3, (-14+hash(i,2,1)*10)*SC); g.scale.setScalar(0.7);
  scene.add(g); clouds.push(g);
}

/* ---------------- 건물/도구 정의 ---------------- */
const TOOLS = {

  port:    {name:'항구',     icon:'⚓', cost:200, year:1970},

  shop:    {name:'상가',     icon:'🏪', cost:120, year:1980},
  factory: {name:'공장',     icon:'🏭', cost:300, year:1980},
  apt:     {name:'아파트',   icon:'🏢', cost:250, year:1990},
  school:  {name:'학교',     icon:'🏫', cost:200, year:1970, group:'city'},
  station: {name:'기차역',   icon:'🚉', cost:400, year:1975, group:'city'},
  hospital:{name:'병원',     icon:'🏥', cost:300, year:1985, group:'city'},
  park:    {name:'공원',     icon:'⛲', cost:80,  year:1995, group:'city'},
  mart:    {name:'대형마트', icon:'🛒', cost:350, year:1995, group:'city'},
  office:  {name:'고층빌딩', icon:'🏙️', cost:500, year:2000, group:'city'},
  stadium: {name:'경기장',   icon:'🏟️', cost:600, year:2005, group:'city'},
  tourism: {name:'관광지',   icon:'🏖️', cost:250, year:1990},
  wind:    {name:'풍력발전', icon:'🌬️', cost:200, year:2010},
  bulldoze:{name:'철거',     icon:'🧹', cost:5,   year:1970, paint:true},
};

const HINTS = {

  terrace:'⛰️ 비탈진 땅은 계단처럼 깎아 밭을 만들어요(계단식 밭). 평지보다 수확이 적어요.',
  port:'⚓ 바다와 닿은 곳에는 항구가 생겨 수산업과 무역이 발달해요!',

  factoryMountain:'🏭 산지는 평지가 좁아 공장을 많이 지을 수 없어요.',

/* ---------------- 지형 만들기 ---------------- */
function genTerrain(M){
  for(let x=0;x<N;x++) for(let z=0;z<N;z++){
    let h, kind;
    if(M.type==='coast'){
      const d = x + Math.sin(z*0.55)*1.3 + (noise(x*0.4,z*0.4,1)-0.5)*1.5;
      if(d<5){ h=-0.5; kind='sea'; }
      else if(d<6.6){ h=0.25; kind='sand'; }
      else { h=q(0.5 + Math.max(0,d-(N-7))*0.32 + noise(x*0.3,z*0.3,2)*0.4); kind = h>=2.25?'rock':'grass'; }
    } else if(M.type==='plain'){
      const rz = riverZ(x);
      if(Math.abs(z-rz)<0.85){ h=-0.3; kind='river'; }
      else { h = q(0.5 + noise(x*0.3,z*0.3,6)*0.3 + Math.max(0,x+z-(2*N-11))*0.3); kind = h>=2.25?'rock':'grass'; }
    } else {
      const dz = Math.abs(z - valleyC(x));
      if(dz<0.9){ h=-0.3; kind='river'; }
      else {
        h = q(0.5 + Math.max(0,dz-1.5)*0.3/SC + noise(x*0.35,z*0.35,3)*(dz>3?0.9:0.25));   // 지도가 넓어져도 산 높이는 그대로
        kind = h>=3.5?'snow':h>=2.5?'rock':'grass';
      }
    }
    M.tiles.push({x,z,h,kind,water:kind==='sea'||kind==='river',b:null,variant:null,bld:null});
  }
}
const get = (M,x,z) => (x<0||z<0||x>=N||z>=N)? null : M.tiles[x*N+z];
const nbrs = (M,t) => [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dz])=>get(M,t.x+dx,t.z+dz)).filter(Boolean);
function slope(M,t){ let s=0; for(const n of nbrs(M,t)) if(!n.water) s=Math.max(s,Math.abs(n.h-t.h)); return s; }
const adjRoad = (M,t) => nbrs(M,t).some(n=>n.b==='road');
const adjSea = (M,t) => nbrs(M,t).find(n=>n.kind==='sea');

const TCOL = {sea:'#3b7fa8',river:'#4a8bb0',sand:'#f1d595',grass:'#86c66c',rock:'#a39783',snow:'#f4f7fa'};
const unitBox = new THREE.BoxGeometry(1,1,1); unitBox.translate(0,0.5,0);
function tileColor(t){
  const c = new THREE.Color(TCOL[t.kind]);
  if(t.kind==='grass') c.lerp(new THREE.Color('#5d9e4e'), Math.min(1,t.h/2.6));
  const v = Math.floor(hash(t.x,t.z,5)*3)/3*0.06;
  c.offsetHSL(0,0,v-0.03);
  return '#'+c.getHexString();
}
function buildTerrain(M){
  for(const t of M.tiles){
    const m = new THREE.Mesh(unitBox, mat(tileColor(t)));
    m.position.set(wx(t.x), -1, wz(t.z));
    m.scale.y = t.h + 1;
    m.receiveShadow = true; m.castShadow = !t.water;
    m.userData.tile = t;
    M.group.add(m); M.tileMeshes.push(m);
  }
  const base = box(N+0.02, 0.6, N+0.02, '#7b5e45', 0, -1.6, 0); M.group.add(base);
  // 물(로우폴리 물결)
  const wg = new THREE.PlaneGeometry(N, N, N, N); wg.rotateX(-Math.PI/2);
  const water = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({color:'#5bc0eb',transparent:true,opacity:0.78,flatShading:true,roughness:0.3,metalness:0.1}));
  water.position.y = -0.08; M.group.add(water); M.water = water;
}

function makeRoadPlan(M){
  const plan = [];
  if(M.type==='coast'){
    const roadX = z => { for(let x=0;x<N;x++){ const t=get(M,x,z); if(t.kind==='grass') return x+1; } return 8; };
    const main = []; for(let z=0;z<N;z++) main.push(get(M,roadX(z),z));
    const zc = N/2;
    main.sort((a,b)=>Math.abs(a.z-zc)-Math.abs(b.z-zc));
    plan.push(...main);
    const x0 = roadX(zc); for(let x=x0+1;x<N-3;x++) plan.push(get(M,x,zc));
    for(let z=4;z<N-3;z++) if(z!==zc) plan.push(get(M,x0+6,z));
    M.cx = x0+3; M.cz = zc;
  } else if(M.type==='plain'){
    const cand = [];
    // 도로 사이 블록을 4칸 폭으로 두어 2×2·3×3 건물이 들어갈 수 있게
    const rows = [9,14,19], cols = [3,8,13,18];
    for(const z of rows) for(let x=1;x<N-1;x++) cand.push(get(M,x,z));
    for(const x of cols) for(let z=1;z<N-1;z++) if(!rows.includes(z)) cand.push(get(M,x,z));
    cand.sort((a,b)=>Math.hypot(a.x-12,a.z-14)-Math.hypot(b.x-12,b.z-14));
    plan.push(...cand);
    M.cx = 12; M.cz = 14;
  } else {
    const main = [];
    for(let x=0;x<N;x++){
      const c = Math.round(valleyC(x)); let best=null;
      for(let z=c+1;z<=c+3;z++){ const t=get(M,x,z); if(t && !t.water && (!best || t.h<best.h)) best=t; }
      if(best) main.push(best);
    }
    const xm = N/2;
    main.sort((a,b)=>Math.abs(a.x-xm)-Math.abs(b.x-xm));
    plan.push(...main);
    // 반대편으로 건너는 다리 겸 도로, 산으로 오르는 길
    const c10 = Math.round(valleyC(xm));
    for(let z=c10+3; z<N; z++) plan.push(get(M,xm,z));
    for(let z=c10-2; z>=0; z--) plan.push(get(M,xm,z));
    M.cx = xm; M.cz = c10+2;
  }
  M.roadPlan = plan.filter(Boolean); M.roadIdx = 0;
}

/* ---------------- 건설 규칙 ---------------- */
function check(M, tool, t, o){
  // o.s / o.road: 여러 칸 건물일 때 건물 전체 기준의 경사·도로 접함을 넘겨받음
  const T = TOOLS[tool], s = (o && o.s!=null) ? o.s : slope(M,t);
  if(tool==='look') return {ok:false, msg:''};
  if(M.year < T.year) return {ok:false, msg:`🔒 ${T.year}년부터 지을 수 있어요`};
  if(tool==='bulldoze') return t.b ? {ok:true,cost:T.cost} : {ok:false,msg:'철거할 것이 없어요'};
  if(t.water && !(tool==='road' && t.kind==='river')) return {ok:false, msg: t.kind==='sea'?'바다 위에는 지을 수 없어요':'강 위에는 지을 수 없어요 (도로는 다리로 놓을 수 있어요)'};
  if(t.b) return {ok:false, msg:'이미 무언가 있어요 (철거 먼저)'};
  const road = (o && o.road!=null) ? o.road : adjRoad(M,t);
  const R = (extra) => Object.assign({ok:true,cost:T.cost}, extra||{});
  const F = (msg) => ({ok:false,msg});
  switch(tool){
    case 'road':
      if(t.water) return R({cost:T.cost*4, msg:'다리 공사: 비용 4배', hint:'bridge'});
      if(s>1.25) return F('너무 가팔라 도로를 낼 수 없어요 (터널이 필요해요)');
      if(t.kind==='snow') return F('눈 덮인 봉우리에는 길을 낼 수 없어요');
      return s>0.5 ? R({cost:T.cost*3, msg:'비탈길 공사: 비용 3배', hint:'steepRoad'}) : R();
    case 'house':
      if(t.kind==='snow'||t.kind==='rock') return F('바위산에는 집을 짓기 어려워요');
      if(s>0.75) return F('땅이 너무 가팔라 집을 지을 수 없어요');
      return R();
    case 'farm':
      if(t.kind==='sand') return F('모래땅은 농사가 어려워요');
      if(t.kind==='rock'||t.kind==='snow') return F('바위산이라 농사를 지을 수 없어요');
      if(s>1) return F('너무 가팔라 밭도 만들 수 없어요');
      return s>0.25 ? R({variant:'terrace',msg:'비탈이라 계단식 밭이 돼요',hint:'terrace'}) : R({variant:'paddy',msg:'평지라 논이 돼요',hint:'paddy'});
    case 'port':
      if(M.type==='mountain') return F('강이 좁고 얕아 큰 배가 다닐 수 없어요');
      if(M.type==='plain') return F('들 마을의 강은 작은 배만 다녀서 항구를 지을 수 없어요');
      if(!adjSea(M,t)) return F('바다와 맞닿은 땅에만 지을 수 있어요');
      return R({hint:'port'});
    case 'tree':
      if(t.kind==='sand') return R({msg:'바닷가 방풍림',hint:'windbreak'});
      return R(M.type==='mountain' && t.h>=1.5 ? {hint:'mountainForest'} : {});
    case 'shop':
      if(s>0.5) return F('땅이 비탈져 상가를 짓기 어려워요');
      if(!road) return F('도로 옆에만 지을 수 있어요');
      return R();
    case 'factory':
      if(s>0.25 || t.kind!=='grass') return F('공장은 넓고 평평한 땅이 필요해요');
      if(!road) return F('도로 옆에만 지을 수 있어요');
      return R({hint: M.type==='coast'?'factoryCoast':M.type==='plain'?'factoryPlain':'factoryMountain'});
    case 'apt':
      if(s>0.25 || t.kind!=='grass') return F('아파트는 평평한 땅이 필요해요');
      if(!road) return F('도로 옆에만 지을 수 있어요');
      return R({hint:'apt'});
    case 'tourism':
      if(M.type==='plain'){ if(s>0.25 || t.kind!=='grass') return F('놀이공원은 넓고 평평한 땅이 필요해요'); if(!road) return F('도로 옆에만 지을 수 있어요'); return R({variant:'themepark',hint:'themepark'}); }
      if(M.type==='coast') return t.kind==='sand' ? R({variant:'beach',hint:'beach'}) : F('해수욕장은 모래사장에만 지을 수 있어요');
      return t.h>=2 ? R({variant:'ski',hint:'ski'}) : F('스키장은 높은 산(해발 160m 이상)에 지어요');
    case 'wind':
      if(M.type==='plain') return t.h>=1.5 ? R({hint:'windPlain'}) : F('바람이 센 언덕 위(해발 120m 이상)에 지어요');
      if(M.type==='coast') return (t.kind==='sand'||t.h>=2) ? R({hint:'windCoast'}) : F('바람이 센 바닷가나 언덕 위에 지어요');
      return t.h>=2.5 ? R({hint:'windMountain'}) : F('바람이 센 높은 산 능선(해발 200m 이상)에 지어요');
    case 'school': case 'station': case 'hospital': case 'mart': case 'office': case 'stadium':
      if(s>0.25 || t.kind!=='grass') return F(`${T.name}: 넓고 평평한 땅이 필요해요`);
      if(!road) return F('도로 옆에만 지을 수 있어요');
      return R({hint:tool});
    case 'park':
      if(t.kind==='rock'||t.kind==='snow'||t.kind==='sand') return F('공원은 풀밭 위에 만들어요');
      if(s>0.5) return F('땅이 너무 비탈져요');
      return R({hint:'park'});
  }
  return F('');
}

/* ---------------- 여러 칸 건물: 자리 검사·자리 고르기 ---------------- */
// (ax,az)에서 시작하는 w×d 자리에 지을 수 있는지. 모든 칸이 조건을 만족해야 함
function footCheck(M, tool, ax, az, w, d){
  const tiles = [];
  for(let i=0;i<w;i++) for(let j=0;j<d;j++){ const t = get(M, ax+i, az+j); if(!t) return null; tiles.push(t); }
  const base = {tiles, ax, az, w, d};
  if(tiles.length===1) return Object.assign(check(M, tool, tiles[0]), base);
  const land = tiles.filter(t=>!t.water);
  const s = land.length ? Math.max(...land.map(t=>t.h)) - Math.min(...land.map(t=>t.h)) : 0;   // 자리 안의 높이 차
  const road = tiles.some(t => nbrs(M,t).some(n => n.b==='road' && !tiles.includes(n)));
  let first = null;
  for(const t of tiles){
    const r = check(M, tool, t, {s, road});
    if(!r.ok) return Object.assign(r, base);
    first = first || r;
  }
  return Object.assign(first, base, {road});
}
// 마우스가 가리키는 칸(t)을 포함하는 자리 중 지을 수 있는 곳을 고름. 가운데에 가까운 자리, 긴 건물은 두 방향 모두 시도
function choosePlace(M, tool, t){
  if(tool==='bulldoze'){
    const T = TOOLS.bulldoze;
    if(M.year < T.year) return {ok:false, msg:''};
    return t.bld ? {ok:true, cost:T.cost, tiles:t.bld.tiles, ax:t.bld.x, az:t.bld.z, w:t.bld.w, d:t.bld.d, bld:t.bld}
                 : {ok:false, msg:'철거할 것이 없어요', tiles:[t], ax:t.x, az:t.z, w:1, d:1};
  }
  const [w0, d0] = footSize(M, tool);
  const orients = w0===d0 ? [[w0,d0]] : [[w0,d0],[d0,w0]];
  const cands = [];
  for(const [w,d] of orients) for(let ax=t.x-w+1; ax<=t.x; ax++) for(let az=t.z-d+1; az<=t.z; az++)
    cands.push({ax, az, w, d, dist: Math.hypot(ax+(w-1)/2-t.x, az+(d-1)/2-t.z)});
  cands.sort((a,b)=>a.dist-b.dist);
  let fallback = null;
  for(const c of cands){
    const r = footCheck(M, tool, c.ax, c.az, c.w, c.d);
    if(!r) continue;
    if(r.ok) return r;
    fallback = fallback || r;
  }
  return fallback || {ok:false, msg:`${toolName(M,tool)}을(를) 놓을 공간이 부족해요 (${w0}×${d0}칸)`, tiles:[t], ax:t.x, az:t.z, w:1, d:1};
}

/* ---------------- 브라우저 저장 (localStorage, DB 없음) ---------------- */
// v2: 지도 24×24 + 여러 칸 건물(x,z,w,d). v1(20×20) 저장은 맞지 않아 쓰지 않음
const STORE_VER = 2, STORE_MAX = 50*1024, MAX_LOGS = 60;
const storeKey = type => `village3d:v${STORE_VER}:${type}`;
const isNum = v => typeof v==='number' && isFinite(v);
const store = {
  ok: true,
  probe(){
    try{ const k='village3d:probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); this.ok = true; }
    catch(e){ this.ok = false; }
    return this.ok;
  },
  save(M){
    try{
      const data = {v:STORE_VER, type:M.type, year:M.year, pop:M.pop, money:M.money,
        hist:M.hist.map(h=>({year:h.year,pop:h.pop})), logs:M.logs.slice(0,MAX_LOGS).map(l=>({year:l.year,text:l.text})),
        hints:M.hints, done:M.done, roadIdx:M.roadIdx,
        buildings:M.blds.map(B=>({x:B.x,z:B.z,w:B.w,d:B.d,b:B.b,variant:B.variant}))};
      let s = JSON.stringify(data);
      // 크기 제한: 넘으면 오래된 기록부터 줄인다
      for(const n of [30,10,0]){ if(new TextEncoder().encode(s).length <= STORE_MAX) break; data.logs = data.logs.slice(0,n); s = JSON.stringify(data); }
      if(new TextEncoder().encode(s).length > STORE_MAX) throw new Error('too big');
      localStorage.setItem(storeKey(M.type), s);
      this.ok = true;
    } catch(e){ this.ok = false; }
    showSaveState();
    return this.ok;
  },
  load(type){
    try{
      const s = localStorage.getItem(storeKey(type));
      if(!s) return null;
      const d = JSON.parse(s);
      const valid = d && d.v===STORE_VER && d.type===type
        && isNum(d.year) && d.year>=START_YEAR && d.year<=END_YEAR && (d.year-START_YEAR)%STEP===0
        && isNum(d.pop) && isNum(d.money) && isNum(d.roadIdx)
        && Array.isArray(d.hist) && d.hist.length>0 && d.hist.every(h=>h && isNum(h.year) && isNum(h.pop))
        && Array.isArray(d.logs) && d.logs.every(l=>l && isNum(l.year) && typeof l.text==='string')
        && Array.isArray(d.buildings) && d.buildings.every(b=>b && Number.isInteger(b.x) && Number.isInteger(b.z)
             && Number.isInteger(b.w) && Number.isInteger(b.d) && b.w>=1 && b.d>=1 && b.w<=3 && b.d<=3
             && b.x>=0 && b.z>=0 && b.x+b.w<=N && b.z+b.d<=N && typeof b.b==='string' && TOOLS[b.b] && b.b!=='look' && b.b!=='bulldoze')
        && d.hints && typeof d.hints==='object' && d.done && typeof d.done==='object';
      return valid ? d : null;
    } catch(e){ return null; }
  },
  clear(type){
    try{ localStorage.removeItem(storeKey(type)); return true; } catch(e){ return false; }
  },
};
function showSaveState(){
  const el = document.getElementById('s-save'); if(!el) return;
  el.textContent = store.ok ? '💾 저장됨' : '⚠️ 저장 안 됨';
  el.classList.toggle('warn', !store.ok);
  el.title = store.ok ? '이 브라우저에 자동으로 저장돼요' : '이 브라우저에서는 저장할 수 없어요. 새로고침하면 처음으로 돌아가요.';
}

function makeMap(type, saved){
  const M = {type, year:START_YEAR, pop:0, money:2000, env:100, jobs:0, housing:0, tiles:[], tileMeshes:[],
             group:new THREE.Group(), blds:[], hist:[], logs:[], hints:{}, done:{}, ready:false};
  genTerrain(M); buildTerrain(M); makeRoadPlan(M);
  if(saved){
    // 건물 다시 짓기: 도로를 먼저 지어야 기차역·다리 방향이 맞는다 (M.ready=false → 애니메이션·힌트 없음)
    const list = saved.buildings.slice().sort((a,b)=>(a.b==='road'?0:1)-(b.b==='road'?0:1));
    for(const bd of list){
      const tiles = [];
      for(let i=0;i<bd.w;i++) for(let j=0;j<bd.d;j++) tiles.push(get(M, bd.x+i, bd.z+j));
      if(tiles.some(t => !t || t.b || (t.water && bd.b!=='road'))) continue;
      const bld = place(M, bd.b, {tiles, ax:bd.x, az:bd.z, w:bd.w, d:bd.d, variant: bd.variant || null}, true);
      bld.mesh.userData.shown = true;
    }
    Object.assign(M, {year:saved.year, pop:saved.pop, money:saved.money, roadIdx:saved.roadIdx,
      hist:saved.hist.map(h=>({year:h.year,pop:h.pop})), logs:saved.logs.slice(0,MAX_LOGS).map(l=>({year:l.year,text:l.text})),
      hints:{...saved.hints}, done:{...saved.done}});
    const s = calc(M); M.jobs=s.jobs; M.housing=s.housing; M.env=s.env;
    M.ready = true; M.restored = true;
    scene.add(M.group);
    return M;
  }
  scene.add(M.group);
  for(const [tool,n] of START_PRESET[type]) autoPlace(M,tool,n);
  const s = calc(M); M.pop = s.housing; M.jobs=s.jobs; M.housing=s.housing; M.env=s.env;
  M.hist.push({year:M.year, pop:M.pop});
  M.ready = true;
  addLog(M, ERA[type][0]);
  addLog(M, type==='coast' ? '👋 바닷가 작은 마을에서 시작해요. 왼쪽 도구를 골라 땅을 눌러 건물을 지어 보세요!' : '👋 골짜기의 작은 마을에서 시작해요. 땅 위에 마우스를 올리면 높이와 경사를 알 수 있어요!');
  return M;
}

function calc(M){
  const c = {road:0,house:0,farm:0,paddy:0,terrace:0,port:0,tree:0,shop:0,factory:0,apt:0,tourism:0,wind:0,
             school:0,station:0,hospital:0,park:0,mart:0,office:0,stadium:0};
  for(const B of M.blds){ c[B.b]++; if(B.b==='farm') c[B.variant]++; }   // 건물 수(칸 수가 아님)
  const housing = c.house*5 + c.apt*30;
  const jobs = c.paddy*3 + c.terrace*2 + c.port*12 + c.factory*25 + c.shop*10 + c.tourism*15 + c.wind*3
             + c.school*8 + c.station*10 + c.hospital*15 + c.park*1 + c.mart*20 + c.office*40 + c.stadium*10;
  const env = Math.round(Math.max(0, Math.min(100, 100 - c.factory*8 - c.port*2 - c.apt*1 - c.road*0.2 + c.tree*1.2 + c.wind*1
             - c.office*1.5 - c.mart*1 - c.stadium*1 + c.park*5)));
  return {c, housing, jobs, env};
}

function simulate(M){
  const {c, housing, jobs, env} = calc(M);
  let target = Math.min(housing, jobs*2 + 10);
  M.outflow = false;
  if(M.type==='mountain' && M.year>=1980 && M.year<2000 && c.tourism===0){ target *= 0.75; M.outflow = true; }
  M.noSchool = M.pop>=80 && c.school===0; M.noHospital = M.pop>=200 && c.hospital===0;
  if(M.noSchool) target *= 0.85;
  if(M.noHospital) target *= 0.85;
  if(c.station>0) target = Math.min(housing, target*1.1);
  const grow = target > M.pop ? (env<40?0.3:0.65) : 0.5;
  M.pop = Math.max(0, Math.round(M.pop + (target - M.pop)*grow));
  const income = Math.round(M.pop*4 + c.port*80 + c.factory*120 + c.shop*60 + c.tourism*130*(env/100) + c.paddy*22 + c.terrace*14 + c.wind*50
             + c.station*60 + c.hospital*30 + c.mart*90 + c.office*160 + c.stadium*120*(env/100));
  const upkeep = Math.round(c.road*2 + c.apt*10 + c.factory*20 + c.school*10 + c.hospital*15 + c.park*3);
  M.money += income - upkeep;
  M.lastIncome = income - upkeep;
  M.env = env; M.jobs = jobs; M.housing = housing;
}

// 건물 하나의 3D 모델. 바깥 그룹(위치·등장 애니메이션) 안에 모델을 넣는다
function makeBldMesh(M, B){
  const outer = new THREE.Group(), anims = [];
  const key = B.b==='tourism' ? 'tourism-'+B.variant : B.b;
  const collect = g => { if(g.userData.anim) anims.push(g.userData.anim); };
  const t0 = B.tiles[0];
  if(B.tiles.length===1){
    const g = buildMesh(M, B.b, t0); collect(g); outer.add(g);
    outer.position.set(wx(t0.x), t0.h, wz(t0.z));
  } else {
    const cx = wx(B.x)+(B.w-1)/2, cz = wz(B.z)+(B.d-1)/2;
    if(TILED(key)){
      // 칸마다 모델: 각 칸의 높이에 맞춰 놓여 비탈(스키장)이나 해안선(항구·해수욕장)을 따라감
      outer.position.set(cx, 0, cz);
      B.tiles.forEach((t,i) => { const g = buildMesh(M, B.b, t, i); g.position.set(wx(t.x)-cx, t.h, wz(t.z)-cz); collect(g); outer.add(g); });
    } else {
      // 모델 하나를 건물 크기만큼 늘림. 자리 안의 작은 높이 차는 받침돌로 메움
      const hs = B.tiles.map(t=>t.h), top = Math.max(...hs), dh = top - Math.min(...hs);
      outer.position.set(cx, top, cz);
      if(dh>0) outer.add(box(B.w-0.04, dh, B.d-0.04, '#b5ab9b', 0, -dh, 0));
      const scaler = new THREE.Group(); scaler.scale.set(B.w, SY[key]||1, B.d);
      const g = buildMesh(M, B.b, t0);
      if(B.b==='station') g.rotation.y = B.w>=B.d ? 0 : Math.PI/2;   // 선로를 긴 방향으로
      collect(g); scaler.add(g); outer.add(scaler);
    }
  }
  if(anims.length) outer.userData.anim = (dt,time) => anims.forEach(f=>f(dt,time));
  return outer;
}

// r: {tiles, ax, az, w, d, variant, cost, hint} (footCheck/choosePlace 결과). 지은 건물을 돌려줌
function place(M, tool, r, free){
  if(tool==='bulldoze'){
    const B = r.bld;
    M.group.remove(B.mesh);
    for(const t of B.tiles){ t.b=null; t.variant=null; t.bld=null; }
    M.blds.splice(M.blds.indexOf(B), 1);
    if(!free) M.money -= r.cost;
    return null;
  }
  const B = {b:tool, variant:r.variant||null, x:r.ax, z:r.az, w:r.w, d:r.d, tiles:r.tiles};
  for(const t of B.tiles){ t.b = tool; t.variant = B.variant; t.bld = B; }
  B.mesh = makeBldMesh(M, B);
  M.group.add(B.mesh); M.blds.push(B);
  if(!free) M.money -= r.cost;
  if(M.ready){ B.mesh.scale.setScalar(0.01); pops.push({g:B.mesh,k:0}); }
  if(M.ready && r.hint && !M.hints[r.hint]){ M.hints[r.hint]=true; addLog(M, HINTS[r.hint]); if(M===cur()) toast(HINTS[r.hint], 3800); }
  return B;
}

function autoPlace(M, tool, n){
  if(tool==='road'){
    let k=0;
    while(k<n && M.roadIdx < M.roadPlan.length){
      const t = M.roadPlan[M.roadIdx++]; const r = footCheck(M,'road',t.x,t.z,1,1);
      if(r.ok){ place(M,'road',r,true); k++; }
    }
    return;
  }
  const [w0, d0] = footSize(M, tool);
  const orients = w0===d0 ? [[w0,d0]] : [[w0,d0],[d0,w0]];
  for(let i=0;i<n;i++){
    let best=null, bs=-1e9;
    for(const t of M.tiles) for(const [w,d] of orients){
      const r = footCheck(M,tool,t.x,t.z,w,d); if(!r || !r.ok) continue;
      // 건물 가운데 위치·평균 높이로 점수 계산
      const cx = t.x+(w-1)/2, cz = t.z+(d-1)/2, h = r.tiles.reduce((a,u)=>a+u.h,0)/r.tiles.length;
      const road = r.tiles.length>1 ? r.road : adjRoad(M,t);
      const dd = Math.hypot(cx-M.cx, cz-M.cz), rnd = hash(t.x+i, t.z, M.year);
      let s = -dd + (road?4:0) + rnd*1.5;
      if(tool==='farm') s = -Math.abs(dd-5) + rnd*2 - (road?1:0);
      if(tool==='tree') s = dd*0.35 + slope(M,t)*1.5 + rnd*4 - (road?3:0) + (M.type==='coast' && t.kind==='sand'?1:0);
      if(tool==='tourism') s = (M.type==='mountain'? h*1.5 - dd*0.3 : -Math.abs(cz-M.cz)*0.4) + rnd;
      if(tool==='wind') s = h*2 + rnd*3 + (t.kind==='sand'?2:0);
      if(tool==='port') s = -Math.abs(cz-M.cz) + rnd;
      if(s>bs){ bs=s; best=r; }
    }
    if(!best) break;
    place(M, tool, best, true);
  }
}

function addLog(M, text){ M.logs.unshift({year:M.year, text}); if(M===cur()) renderLog(); }

/* ---------------- 진행 ---------------- */
const maps = {};
let curType = 'coast';
const cur = () => maps[curType];
function loadOrMakeMap(type){
  const saved = store.load(type);
  if(saved){ try{ return makeMap(type, saved); } catch(e){ /* 깨진 저장은 무시하고 새로 시작 */ } }
  return makeMap(type);
}
store.probe();
try{ for(const k of ['coast','mountain','plain']) localStorage.removeItem(`village3d:v1:${k}`); }catch(e){}   // 예전 20×20 저장 정리
maps.coast = loadOrMakeMap('coast');
maps.mountain = loadOrMakeMap('mountain');
maps.plain = loadOrMakeMap('plain');
maps.mountain.group.visible = false; maps.plain.group.visible = false;

function nextTurn(){
  const M = cur();
  if(M.year >= END_YEAR){ showEnd(); return; }
  const before = M.pop;
  simulate(M);
  M.year += STEP;
  const idx = (M.year-START_YEAR)/STEP;
  addLog(M, ERA[M.type][idx]);
  const d = M.pop - before;
  addLog(M, `👪 인구 ${before} → ${M.pop}명 (${d>=0?'+':''}${d}) · 💰 5년 수입 ${M.lastIncome>=0?'+':''}${M.lastIncome}`);
  if(M.outflow) addLog(M, '🧳 일자리가 적어 젊은 사람들이 도시로 떠나요. 관광지를 만들면 사람들이 머물러요.');
  if(M.noSchool) addLog(M, HINTS.noSchool);
  if(M.noHospital) addLog(M, HINTS.noHospital);
  const unlocked = Object.entries(TOOLS).filter(([k,T])=>T.year===M.year).map(([k,T])=>toolIcon(M,k)+' '+toolName(M,k));
  if(unlocked.length) addLog(M, '🔓 새로 지을 수 있어요: ' + unlocked.join(', '));
  if(M.env < 40 && !M.hints.envLow){ M.hints.envLow = true; addLog(M, HINTS.envLow); }
  else if(M.jobs*2 + 10 < M.housing) addLog(M, '💼 일자리가 부족해요! 상가·공장·항구·관광지를 지어 보세요.');
  else if(M.housing <= M.pop+2) addLog(M, '🏠 살 집이 부족해요! 주택이나 아파트를 지어 보세요.');
  M.hist.push({year:M.year, pop:M.pop});
  updateUI();
  store.save(M);
  if(M.year >= END_YEAR){ stopAuto(); stopTime(); setTimeout(showEnd, 600); }
}

/* ---------------- 시간 흐르기: 학생이 짓는 동안 정해진 간격마다 5년씩 저절로 지나감 ---------------- */
const SPEED_KEY = 'village3d:speed';
let timeOn = false, timeElapsed = 0, timeLast = 0;
const timeSpeed = () => Number($('time-speed').value) || 30;
function renderTimeBtn(){
  const M = cur(), b = $('btn-time');
  b.classList.toggle('running', timeOn);
  b.style.setProperty('--p', timeOn ? Math.min(1, timeElapsed/timeSpeed()) : 0);
  let label;
  if(M.year >= END_YEAR) label = '🏁 결과 보기';
  else if(!timeOn) label = `▶ 시간 흐르기 (${M.year}→${M.year+STEP})`;
  else if(!$('modal').hidden) label = '⏸ 잠시 멈춤';
  else label = `⏸ 멈추기 · ${M.year+STEP}년까지 ${Math.ceil(timeSpeed()-timeElapsed)}초`;
  b.querySelector('.lbl').textContent = label;
}
function startTime(){
  if(cur().year >= END_YEAR){ showEnd(); return; }
  stopAuto();
  timeOn = true; timeLast = performance.now();
  renderTimeBtn();
  toast(`⏱ 시간이 흘러가요! ${timeSpeed()}초마다 5년이 지나요.`);
}
function stopTime(reset){
  if(reset) timeElapsed = 0;
  timeOn = false; renderTimeBtn();
}
setInterval(() => {
  const now = performance.now(), dt = (now - timeLast)/1000; timeLast = now;
  // 창이 열려 있거나(비교·확인·결과) 다른 탭을 보고 있으면 시간이 흐르지 않는다
  if(timeOn && $('modal').hidden && !document.hidden){
    timeElapsed += Math.min(dt, 1);
    if(timeElapsed >= timeSpeed()){ timeElapsed = 0; nextTurn(); }
  }
  renderTimeBtn();
}, 250);

let autoTimer = null;
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent=(autoUnlocked?'▶':'🔒')+' 자동 발전 보기'; b.classList.remove('playing'); }
function startAuto(){
  if(cur().year >= END_YEAR){ toast('이미 2030년이에요. ↺ 다시 시작을 눌러 보세요.'); return; }
  stopTime(true);
  const b=document.getElementById('btn-auto'); b.textContent='⏸ 멈추기'; b.classList.add('playing');
  const step = () => {
    const M = cur();
    if(M.year >= END_YEAR){ stopAuto(); return; }
    const plan = PLAN[M.type][M.year] || [];
    for(const [tool,n] of plan) autoPlace(M, tool, n);
    // 자동 모드에서 새로 지은 건물에도 팝 애니메이션
    for(const B of M.blds) if(!B.mesh.userData.shown){ B.mesh.userData.shown=true; if(!pops.some(p=>p.g===B.mesh)){ B.mesh.scale.setScalar(0.01); pops.push({g:B.mesh,k:0}); } }
    for(const [tool] of plan){ const k = autoHint(M,tool); if(k && !M.hints[k]){ M.hints[k]=true; addLog(M, HINTS[k]); } }
    nextTurn();
  };
  step(); autoTimer = setInterval(step, 2200);
}
function autoHint(M, tool){
  return {port:'port', factory: M.type==='coast'?'factoryCoast':M.type==='plain'?'factoryPlain':'factoryMountain', apt:'apt',
          tourism: M.type==='coast'?'beach':M.type==='plain'?'themepark':'ski', wind: M.type==='coast'?'windCoast':M.type==='plain'?'windPlain':'windMountain',
          school:'school', station:'station', hospital:'hospital', park:'park', mart:'mart', office:'office', stadium:'stadium',
          tree: M.type==='coast'?'windbreak':M.type==='mountain'?'mountainForest':null, farm: M.type==='mountain'?'terrace':'paddy'}[tool];
}

/* ---------------- UI ---------------- */
let tool = 'look';
const $ = id => document.getElementById(id);
function renderTools(){
  const M = cur(); const el = $('tools'); el.innerHTML='';
  let sep = false;
  for(const [k,T] of Object.entries(TOOLS)){
    if(T.group==='city' && !sep){ sep = true; const d=document.createElement('div'); d.className='tool sep'; d.textContent='🏙️ 도시 시설'; el.appendChild(d); }
    const lock = M.year < T.year;
    let name = toolName(M,k), icon = toolIcon(M,k), sub;
    if(k==='port' && M.type!=='coast') sub = '바다 마을만';
    const [fw, fd] = footSize(M, k), size = fw*fd>1 ? ` · ${fw}×${fd}` : '';
    sub = sub || (lock ? `🔒 ${T.year}년` : (k==='look'?'회전·확대':`💰 ${T.cost}${size}`));
    const b = document.createElement('button');
    b.className = 'tool' + (tool===k?' on':'') + (lock?' lock':'');
    b.innerHTML = `<span class="ic">${icon}</span><span>${name}<small>${sub}</small></span>`;
    b.onclick = () => { tool = k; renderTools(); setControlMode(); };
    el.appendChild(b);
  }
}
function toolName(M,k){ return k==='tourism' ? ({coast:'해수욕장',mountain:'스키장',plain:'놀이공원'}[M.type]) : TOOLS[k].name; }
function toolIcon(M,k){ return k==='tourism' ? ({coast:'🏖️',mountain:'⛷️',plain:'🎡'}[M.type]) : TOOLS[k].icon; }
function setControlMode(){
  const paint = TOOLS[tool].paint;
  controls.mouseButtons.LEFT = (tool==='look') ? THREE.MOUSE.ROTATE : (paint ? -1 : THREE.MOUSE.ROTATE);
  controls.touches.ONE = (tool==='look' || !paint) ? THREE.TOUCH.ROTATE : -1;
  if(tool==='look') marker.visible = false;
}
function updateUI(){
  const M = cur(); const s = calc(M);
  M.jobs = s.jobs; M.housing = s.housing; M.env = s.env;
  $('s-year').textContent = M.year + '년';
  $('s-pop').textContent = M.pop;
  $('s-money').textContent = M.money;
  $('s-house').textContent = `${s.housing}명분`;
  $('s-jobs').textContent = s.jobs;
  $('s-env').textContent = s.env + (s.env>=70?' 😊':s.env>=40?' 😐':' 😷');
  $('terrain-desc').innerHTML = TERRAIN_DESC[M.type];
  $('era').textContent = ERA[M.type][(M.year-START_YEAR)/STEP];
  const ul = $('missions'); ul.innerHTML='';
  MISSIONS[M.type].forEach((m,i)=>{
    const ok = M.done[i] || m.f(s.c, M);
    if(ok && !M.done[i]){ M.done[i]=true; if(M.ready){ addLog(M, `🎉 미션 완료: ${m.t}`); toast(`🎉 미션 완료: ${m.t}`); } }
    const li=document.createElement('li'); li.className = ok?'ok':''; li.textContent = (ok?'✅ ':'⬜ ')+m.t; ul.appendChild(li);
  });
  renderTimeBtn();
  renderTools(); renderLog(); drawChart($('chart'), [maps.coast, maps.mountain, maps.plain], M);
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderLog(){ $('log').innerHTML = cur().logs.slice(0,60).map(l=>`<div><b>${esc(l.year)}</b>${esc(l.text)}</div>`).join(''); }

const COLORS = {coast:'#2f8fd8', mountain:'#4c9a4a', plain:'#d99a14'};
const MNAME = {coast:'🌊 바다 마을', mountain:'⛰️ 산 마을', plain:'🌾 들 마을'};
function drawChart(cv, list, focus){
  const ctx = cv.getContext('2d'), W=cv.width, H=cv.height, p=34;
  ctx.clearRect(0,0,W,H);
  const maxP = Math.max(50, ...list.flatMap(M=>M.hist.map(h=>h.pop)));
  ctx.strokeStyle='#dde5ea'; ctx.fillStyle='#789'; ctx.font='18px Noto Sans KR'; ctx.lineWidth=1;
  for(let i=0;i<=2;i++){ const y=H-p-(H-2*p)*i/2; ctx.beginPath(); ctx.moveTo(p,y); ctx.lineTo(W-10,y); ctx.stroke(); ctx.fillText(Math.round(maxP*i/2),2,y+6); }
  for(let yr=START_YEAR; yr<=END_YEAR; yr+=20){ const x=p+(W-p-10)*(yr-START_YEAR)/(END_YEAR-START_YEAR); ctx.fillText(yr, x-20, H-6); }
  for(const M of list){
    const col = COLORS[M.type];
    ctx.strokeStyle = col; ctx.globalAlpha = (!focus || M===focus)?1:0.35; ctx.lineWidth = 4;
    ctx.beginPath();
    M.hist.forEach((h,i)=>{ const x=p+(W-p-10)*(h.year-START_YEAR)/(END_YEAR-START_YEAR), y=H-p-(H-2*p)*h.pop/maxP; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
    const last = M.hist[M.hist.length-1]; const x=p+(W-p-10)*(last.year-START_YEAR)/(END_YEAR-START_YEAR), y=H-p-(H-2*p)*last.pop/maxP;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  [['coast','● 바다'],['mountain','● 산'],['plain','● 들']].forEach(([k,n],i)=>{ ctx.fillStyle=COLORS[k]; ctx.fillText(n, W-200+i*66, 22); });
}

let toastT;
function toast(msg, ms=2200){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }

function switchMap(type){
  if(timeOn && type!==curType) toast('⏸ 다른 마을로 바꿔서 시간을 멈췄어요');
  stopAuto(); stopTime(true); curType = type;
  for(const k in maps){ maps[k].group.visible = k===type; $('tab-'+k).classList.toggle('on', k===type); }
  scene.background.set({coast:'#bfe6ff',mountain:'#cfe7f5',plain:'#d4ecfa'}[type]); scene.fog.color.copy(scene.background);
  updateUI();
}

function compareHTML(){
  const rows = [['📅 연도','year'],['👪 인구','pop'],['💼 일자리','jobs'],['🌿 환경 점수','env'],['💰 예산','money']];

    ['🏫 학교','school'],['🚉 기차역','station'],['🏥 병원','hospital'],['⛲ 공원','park'],['🛒 대형마트','mart'],['🏙️ 고층빌딩','office'],['🏟️ 경기장','stadium']];
  return `<h2>⚖️ 바다 마을 · 산 마을 · 들 마을 비교</h2>

  </table>
  <h2 style="font-size:18px;margin-top:14px">🤔 생각해 볼까요?</h2>
  <ol>
    <li>세 마을에서 가장 많이 지은 건물은 각각 무엇인가요? 왜 그럴까요?</li>
    <li>바다 마을에만 있는 것, 산 마을에만 있는 것은 무엇인가요? 그 까닭은?</li>
    <li>들 마을에 학교·병원·고층빌딩 같은 도시 시설이 많이 생길 수 있었던 까닭은 무엇인가요?</li>
    <li>산 마을에서 건물을 짓기 어려웠던 까닭은 무엇인가요?</li>
    <li>세 마을의 인구는 어떻게 다르게 변했나요? 그래프를 보고 말해 보세요.</li>
    <li>자연을 지키면서 마을을 발전시키려면 어떻게 해야 할까요?</li>
  </ol>`;
}
function showCompare(){
  $('modal-body').innerHTML = compareHTML(); $('modal').hidden = false;
  drawChart($('cmp-chart'), [maps.coast, maps.mountain, maps.plain], null);
}
function showEnd(){
  const M = cur();
  const s = calc(M);
  const doneN = MISSIONS[M.type].filter((m,i)=>M.done[i]).length;

   일자리 <b>${s.jobs}개</b>, 환경 점수 <b>${s.env}점</b>, 미션 <b>${doneN}/5</b>개 완료!</p>
   <p style="font-size:14px">다른 마을도 키워 본 뒤 <b>⚖️ 마을 비교</b>를 눌러 차이를 살펴보세요.</p>` ;

}

$('tab-coast').onclick = () => switchMap('coast');
$('tab-mountain').onclick = () => switchMap('mountain');
$('tab-plain').onclick = () => switchMap('plain');
$('btn-time').onclick = () => cur().year >= END_YEAR ? showEnd() : (timeOn ? stopTime() : startTime());
try{ const v = localStorage.getItem(SPEED_KEY); if(['15','30','60'].includes(v)) $('time-speed').value = v; }catch(e){}
$('time-speed').onchange = () => {
  try{ localStorage.setItem(SPEED_KEY, $('time-speed').value); }catch(e){}
  timeElapsed = Math.min(timeElapsed, timeSpeed()-1);
  renderTimeBtn();
};
// 자동 발전 보기는 선생님용: 비밀번호를 맞혀야 시작. 한 번 맞히면 새로고침 전까지 다시 묻지 않음
// (비밀번호는 소스에 그대로 두지 않고 해시값만 둠. 학생이 바로 누르는 것을 막는 정도의 잠금)
let autoUnlocked = false;
const AUTO_PW_HASH = 'd8ee62e2';
const pwHash = s => { let x = 0x811c9dc5; for(const ch of 'village3d:'+s){ x ^= ch.charCodeAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16); };
function askAutoPassword(){
  stopTime();
  showConfirm(`<h2>🔒 선생님 확인</h2>
    <p style="font-size:15px;line-height:1.7">자동 발전 보기는 선생님만 켤 수 있어요.<br>비밀번호를 입력해 주세요.</p>
    <input id="pw-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="비밀번호">
    <div id="pw-msg"></div>`, '확인', () => {});
  const input = $('pw-input'), yes = $('confirm-yes');
  $('confirm-no').textContent = '취소';
  const submit = () => {
    if(pwHash(input.value.trim()) === AUTO_PW_HASH){
      autoUnlocked = true; closeModal(); toast('🔓 자동 발전 보기를 시작해요'); startAuto();
    } else {
      $('pw-msg').textContent = '비밀번호가 맞지 않아요.';
      input.value = ''; input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.focus();
    }
  };
  yes.onclick = submit;
  input.onkeydown = e => { if(e.key==='Enter') submit(); };
  setTimeout(() => input.focus(), 50);
}
$('btn-auto').onclick = () => autoTimer ? stopAuto() : (autoUnlocked ? startAuto() : askAutoPassword());
$('btn-compare').onclick = () => { stopAuto(); showCompare(); };
function closeModal(){ $('modal').hidden = true; $('modal-close').hidden = false; }
function showConfirm(html, yesLabel, onYes){
  $('modal-body').innerHTML = html +
    `<div class="confirm-btns"><button id="confirm-yes">${yesLabel}</button><button id="confirm-no">아니요</button></div>`;
  $('modal-close').hidden = true; $('modal').hidden = false;
  $('confirm-yes').onclick = () => { closeModal(); onYes(); };
  $('confirm-no').onclick = closeModal;
}
$('btn-reset').onclick = () => {
  stopAuto(); stopTime();
  const type = curType;
  showConfirm(`<h2>↺ 정말 처음부터 다시 할까요?</h2>
    <p style="font-size:15px;line-height:1.7"><b>${MNAME[type]}</b>을 1970년으로 되돌리고, 이 마을의 저장 기록을 지워요.<br>다른 두 마을은 그대로 남아요.</p>`,
    '네, 다시 시작', () => {
      store.clear(type);
      const old = maps[type]; scene.remove(old.group);
      maps[type] = makeMap(type); switchMap(type);
      toast('처음 1970년으로 돌아갔어요');
    });
};
$('modal-close').onclick = closeModal;
$('modal').onclick = e => { if(e.target.id==='modal') closeModal(); };
$('panel-toggle').onclick = () => $('panel').classList.toggle('open');

/* ---------------- 마우스/터치 ---------------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const marker = new THREE.Mesh(new THREE.BoxGeometry(1.02,0.08,1.02), new THREE.MeshBasicMaterial({color:'#00e676',transparent:true,opacity:0.45,depthWrite:false}));
marker.visible = false; scene.add(marker);
let hover = null, downPos = null, painting = false, lastPaint = null;
const tip = $('tip');

function pick(e){
  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cur().tileMeshes, false)[0];
  return hit ? hit.object.userData.tile : null;
}
function terrainName(M,t){
  if(t.kind==='sea') return '🌊 바다'; if(t.kind==='river') return '🏞️ 강';
  if(t.kind==='sand') return '🏖️ 모래사장(해안)'; if(t.kind==='snow') return '🏔️ 눈 덮인 봉우리'; if(t.kind==='rock') return '🪨 바위산';
  const s = slope(M,t); return s<=0.25?'🟩 평지': s<=0.75?'⛰️ 완만한 비탈':'⛰️ 가파른 비탈';
}
const BNAME = t => !t.b ? '' : t.b==='farm' ? (t.variant==='terrace'?'계단식 밭':'논') : t.b==='tourism' ? ({beach:'해수욕장',ski:'스키장',themepark:'놀이공원'}[t.variant]) : (t.b==='road'&&t.water) ? '다리' : TOOLS[t.b].name;

function showTip(e, t){
  const M = cur();
  if(!t){ tip.style.display='none'; marker.visible=false; return; }
  let html = `<b>${terrainName(M,t)}</b>`;
  if(!t.water) html += `<br>해발 ${Math.round(t.h*80)}m · 경사 ${slope(M,t)<=0.25?'평평함':slope(M,t)<=0.75?'약간 비탈':'가파름'}`;
  if(t.b) html += `<br>🏗️ ${BNAME(t)}${t.bld && t.bld.tiles.length>1 ? ` (${t.bld.w}×${t.bld.d}칸)` : ''}`;
  if(tool!=='look'){
    const r = choosePlace(M, tool, t);
    const enough = r.ok && M.money >= r.cost;
    const [fw, fd] = footSize(M, tool);
    if(tool!=='bulldoze' && fw*fd>1) html += `<br>📐 ${toolName(M,tool)}: ${fw}×${fd}칸 필요`;
    html += r.ok ? `<br>${enough?'✅':'💸'} ${r.msg?r.msg+' · ':''}비용 ${r.cost}${enough?'':' (예산 부족)'}` : (r.msg?`<br>❌ ${r.msg}`:'');
    // 건물이 차지할 자리 전체를 초록(가능)/빨강(불가)으로 미리 보여 줌
    const top = Math.max(...r.tiles.map(u=>Math.max(u.h,-0.08)));
    marker.scale.set(r.w, 1, r.d);
    marker.position.set(wx(r.ax)+(r.w-1)/2, top+0.06, wz(r.az)+(r.d-1)/2);
    marker.material.color.set(enough ? '#00e676' : '#ff5252');
    marker.visible = true;
  } else marker.visible = false;
  tip.innerHTML = html; tip.style.display='block';
  tip.style.left = Math.min(innerWidth-250, e.clientX+16)+'px'; tip.style.top = (e.clientY+16)+'px';
}

function tryBuild(t, quiet){
  const M = cur(); if(!t || tool==='look') return;
  const r = choosePlace(M, tool, t);
  if(!r.ok){ if(!quiet && r.msg) toast('❌ '+r.msg); return; }
  if(M.money < r.cost){ if(!quiet) toast('💸 예산이 부족해요! 시간이 흐르면 세금이 들어와요.'); return; }
  place(M, tool, r, false);
  updateUI();
  if(painting) paintDirty = true; else store.save(M);
}
let paintDirty = false;
function endPaint(){ painting = false; if(paintDirty){ paintDirty = false; store.save(cur()); } }

canvas.addEventListener('pointerdown', e => {
  downPos = {x:e.clientX, y:e.clientY};
  if(e.button===0 && TOOLS[tool].paint){ painting = true; const t=pick(e); lastPaint=t; tryBuild(t,false); }
});
canvas.addEventListener('pointermove', e => {
  const t = pick(e); hover = t; showTip(e, t);
  if(painting && t && t!==lastPaint){ lastPaint=t; tryBuild(t,true); }
});
canvas.addEventListener('pointerup', e => {
  if(!painting && downPos && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) < 6 && e.button===0) tryBuild(pick(e), false);
  endPaint(); downPos = null;
});
canvas.addEventListener('pointerleave', () => { tip.style.display='none'; marker.visible=false; endPaint(); });
canvas.addEventListener('pointercancel', () => endPaint());

/* ---------------- 렌더 루프 ---------------- */
const pops = [];
function resize(){ document.documentElement.style.setProperty('--top-h', (document.getElementById('top').offsetHeight+20)+'px'); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// 글꼴 로딩·저장 표시 변경으로 위쪽 바가 두 줄이 되어도 도구 상자·정보 패널이 가려지지 않게
const fitTop = () => {
  const st = document.documentElement.style;
  st.setProperty('--top-h', (document.getElementById('top').offsetHeight+20)+'px');
  st.setProperty('--bottom-h', (document.getElementById('bottom').offsetHeight+20)+'px');
};
if(window.ResizeObserver){ const ro = new ResizeObserver(fitTop); ro.observe(document.getElementById('top')); ro.observe(document.getElementById('bottom')); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTop);

const clock = new THREE.Clock();
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  controls.update();
  const M = cur();
  for(const ch of M.group.children) ch.userData.anim && ch.userData.anim(dt, time);
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.k=Math.min(1,p.k+dt*4); const s=p.k<1? (1-Math.pow(1-p.k,3))*1.08 : 1; p.g.scale.setScalar(Math.max(0.01,s)); if(p.k>=1){ p.g.scale.setScalar(1); pops.splice(i,1);} }
  // 물결
  const pos = M.water.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), z=pos.getZ(i); pos.setY(i, Math.sin(x*1.3+time*1.5)*0.03 + Math.cos(z*1.1+time*1.2)*0.03); }
  pos.needsUpdate = true; M.water.geometry.computeVertexNormals();
  for(const c of clouds){ c.position.x += dt*0.4; if(c.position.x>24*SC) c.position.x=-24*SC; }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
setControlMode(); switchMap('coast'); loop();
if(!store.ok) showSaveState();
else { const el=$('s-save'); el.textContent='💾 자동 저장'; el.title='건물을 짓거나 5년이 지날 때마다 이 브라우저에 저장돼요'; }
if(Object.values(maps).some(M=>M.restored)) toast('💾 지난번 마을을 불러왔어요', 3200);
</script>
